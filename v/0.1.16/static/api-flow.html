<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>예매 API 흐름 — 기차놀이</title>
<style>
:root{--blue:#3182F6;--green:#0CA678;--orange:#F76707;--red:#F04452;--purple:#7048E8;
      --gray:#8B95A1;--field:#4E5968;--line:#E5E8EC;--bg:#F2F4F6;--text:#191F28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  -webkit-text-size-adjust:100%;letter-spacing:-.2px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  padding:12px 16px 0;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.top h1{font-size:17px;margin:0 0 3px;font-weight:800}
.top p{margin:0 0 10px;font-size:12px;color:var(--gray);line-height:1.6}
.cases{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cases::-webkit-scrollbar{display:none}
.case{flex:none;border:none;background:#EDF0F3;color:var(--field);font:700 12.5px/1 inherit;
  padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;letter-spacing:-.2px}
.case.on{background:var(--blue);color:#fff}
.wrap{padding:16px 14px 80px;max-width:860px;margin:0 auto}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.intro{padding:13px 15px;font-size:12.5px;line-height:1.7;color:var(--field);margin-bottom:14px}
.intro b{color:var(--text)}
h2{font-size:12.5px;color:var(--gray);margin:26px 0 10px;font-weight:800}
table.mx{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;border-radius:14px;
  overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table.mx th,table.mx td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.mx th{background:#F7F9FA;color:var(--gray);font-weight:800;font-size:10.5px}
table.mx td:first-child,table.mx th:first-child{text-align:left;font-weight:700;color:var(--text)}
table.mx tr:last-child td{border-bottom:none}
table.mx tr.on td{background:rgba(49,130,246,.07)}
table.mx .y{color:var(--green);font-weight:800}
table.mx .n{color:#C6CDD5}
.step{padding:15px 16px;margin-top:0;scroll-margin-top:120px}
.step.off{opacity:.55}
.hd{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.no{flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;
  font:800 11px/1 inherit;display:flex;align-items:center;justify-content:center}
.no.l{background:var(--green)}.no.w{background:var(--orange)}
.ttl{font-size:15px;font-weight:800;flex:1}
.tag{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:7px;white-space:nowrap}
.t-m{background:rgba(49,130,246,.12);color:#1B64DA}
.t-w{background:rgba(247,103,7,.13);color:#C2410C}
.t-l{background:rgba(12,166,120,.14);color:#0B7A57}
.t-skip{background:#EDF0F3;color:#8B95A1}
.t-dyna{background:rgba(112,72,232,.12);color:#5B32C9}
.ep{font:600 11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue);
  word-break:break-all;margin:2px 0 10px;padding-left:31px}
.note{font-size:12.5px;line-height:1.7;color:var(--field);margin:0 0 10px}
.note.warn{color:#C2410C;background:rgba(247,103,7,.07);border-left:3px solid var(--orange);
  padding:9px 11px;border-radius:0 8px 8px 0}
.note.hit{color:#B02A37;background:rgba(240,68,82,.07);border-left:3px solid var(--red);
  padding:9px 11px;border-radius:0 8px 8px 0}
.note.skip{color:#6B7684;background:#F4F6F8;border-left:3px solid #C6CDD5;
  padding:9px 11px;border-radius:0 8px 8px 0;font-weight:600}
.sec{margin-top:12px}
.sec>h3{font-size:11px;font-weight:800;margin:0 0 2px;padding:7px 10px;border-radius:8px 8px 0 0}
.sec.in>h3{background:rgba(49,130,246,.09);color:#1B64DA}
.sec.out>h3{background:rgba(12,166,120,.10);color:#0B7A57}
.sec.cond>h3{background:rgba(112,72,232,.10);color:#5B32C9}
.sec>div{border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px}
.f{padding:8px 11px;border-top:1px solid #F1F3F5}
.f:first-child{border-top:none}
.fh{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:2px}
.fh code{font:700 11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--text);background:#F1F3F5;padding:1px 5px;border-radius:5px;word-break:break-word}
.sec.cond .fh code{background:rgba(112,72,232,.10);color:#5B32C9}
.rq{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;letter-spacing:0}
.rq.q{background:rgba(240,68,82,.11);color:#C0392F}
.rq.o{background:#EDF0F3;color:#8B95A1}
.rq.c{background:rgba(112,72,232,.12);color:#5B32C9}
.fd{font-size:12px;line-height:1.65;color:var(--field)}
.fd b{color:var(--text)}
.fx{font-size:11px;line-height:1.6;color:var(--gray);margin-top:2px}
.fx s{text-decoration:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#5B6470}
.arrow{height:20px;display:flex;justify-content:center;align-items:center;color:#C6CDD5;font-size:14px}
.foot{margin-top:26px;font-size:11.5px;color:var(--gray);line-height:1.75;text-align:center}
</style></head><body>
<div class="top">
  <h1>예매 API 흐름</h1>
  <p>열차 조회 → 좌석 확인 → 예약 → 결제. 모든 단계와 모든 파라미터를 항상 표시합니다.
     케이스를 고르면 그 경로에서 <b>쓰지 않는 단계</b>에 표시가 붙습니다.</p>
  <div class="cases" id="cases"></div>
</div>
<div class="wrap">
  <div class="card intro" id="intro"></div>
  <h2>케이스별로 어떤 단계를 쓰는가</h2>
  <div id="mx"></div>
  <h2>단계별 상세</h2>
  <div id="flow"></div>
  <div class="foot">기차놀이 내부 문서 · 실측 기준 2026-09-09<br>
    모바일 API <b>smart.letskorail.com</b> · 웹 API <b>www.korail.com</b><br>
    korail.py · web_server.py · korail2(dhfhfk fork)</div>
</div>
<script>
// f: [이름, 필수도, 설명, 예시, 언제만]  필수도: 필 | 선 | 조
const S = [
{id:'code', kind:'m', t:'비밀번호 암호화 키 받기', ep:'POST .common.code.do',
 note:'로그인 직전 1회. 코레일이 매번 새 키를 내려주고, 그 키로 비밀번호를 암호화해야 로그인이 통과된다. 평문 비밀번호는 절대 전송되지 않는다.',
 in:[['code','필','받아올 코드표 이름. 로그인 암호화 키를 달라는 뜻의 고정 문자열.','"app.login.cphd"']],

      ['app.login.cphd.idx','','키 인덱스. 로그인 요청의 idx에 그대로 넣어 "어느 키로 암호화했는지" 알린다.','"3"']]},

{id:'login', kind:'m', dyna:1, t:'로그인', ep:'POST .login.Login',

     ['Version','필','앱 버전. 코레일이 구버전을 막기 때문에 실제 최신 앱 버전을 따라가야 한다.','"250601002"'],
     ['txtInputFlg','필','아이디를 무엇으로 넣었는지 알리는 플래그.','"2" 회원번호 · "4" 휴대폰 · "5" 이메일'],
     ['txtMemberNo','필','아이디. 위 플래그에 맞는 형식으로.','"1234567890"'],
     ['txtPwd','필','①에서 받은 키로 암호화한 비밀번호.','base64 문자열'],
     ['idx','필','①에서 받은 키 인덱스.','"3"'],

     ['(헤더) x-dynapath-m-token','조','Dynapath 보호 경로에서만. 기기ID·타임스탬프·난수 4자로 만든 위변조 방지 토큰. 이게 없으면 로그인 자체가 거부된다 — korail2 원본 대신 포크를 쓰는 이유.','생성 토큰','Dynapath 경로']],
 out:[['strResult','','처리 결과.','"SUCC"'],
      ['Key','','<b>세션 키.</b> 이후 모든 모바일 API 호출의 Key 파라미터로 들어간다. 만료되면 P058 오류.','세션 문자열'],
      ['strMbCrdNo','','회원번호 10자리.','"1234567890"'],
      ['strCustNm','','회원 이름. 앱 로그의 "로그인 성공 · 정영우"가 이 값.','"정영우"'],
      ['strEmailAdr','','등록된 이메일.','"me@example.com"']]},

{id:'sched', kind:'m', dyna:1, t:'열차 조회', ep:'POST .seatMovie.ScheduleView',
 note:'한 번에 최대 10편. 앱은 페이지 마지막 열차의 출발시각 +1분을 다음 txtGoHour로 넣어 다시 부르는 식으로 시간대를 훑는다(슬라이딩 페이징, 기본 상한 6페이지).',
 in:[['Device / Version','필','로그인과 같은 값.','"AD" / "250601002"'],
     ['radJobId','필','조회 업무 구분. 1 = 일반 승차권 조회.','"1"'],
     ['txtMenuId','필','메뉴 구분. 승차권 예매 화면.','"11"'],
     ['txtGoAbrdDt','필','승차일. 이 날짜의 열차만 나온다.','"20260930"'],

     ['txtGoEnd','필','도착역 이름.','"용산"'],
     ['txtGoHour','필','조회 시작 시각. 이 시각 <b>이후</b> 출발 열차부터 준다.','"070000"'],
     ['selGoTrain / txtTrnGpCd','필','열차 종류. 두 값을 같게 보낸다.','"109" 전체 · "100" KTX/산천 · "101" ITX-새마을 · "102" 무궁화'],
     ['txtPsgFlg_1','필','어른 인원.','"1"'],
     ['txtPsgFlg_2 / _8 / _3','선','어린이 / 유아 / 경로 인원. 앱은 어른만 쓰므로 0.','"0"'],
     ['txtPsgFlg_4 / _5','선','중증장애인 / 경증장애인 인원.','"0"'],
     ['txtSeatAttCd_4','필','좌석 속성. 015 = 일반석(휠체어석·자전거석 등이 아닌 보통 자리).','"015"'],
     ['txtSeatAttCd_2 / _3','선','예비 속성 슬롯. 안 쓰면 000.','"000"'],
     ['txtCardPsgCnt / txtGdNo / txtJobDv','선','미사용. 빈 값으로 보낸다.','""'],
     ['adjStnScdlOfrFlg','선','인접역 열차 포함 여부. 켜져 있으면 요청 구간이 아닌 열차(서울→부전 등)가 10편 정원을 잡아먹어 페이지 수만 늘어난다. <b>앱이 N으로 꺼서 주입한다.</b>','"N"']],
 out:[['trn_infos.trn_info[]','','조회된 열차 배열. 아래는 배열 원소의 필드.','최대 10개'],
      ['h_trn_no','','열차 번호.','"406"'],
      ['h_trn_clsf_cd','','<b>열차 형식 코드 = 편성 식별자.</b> 좌석 배치를 가르는 진짜 기준. 열차 그룹(h_trn_gp_cd)으로는 KTX와 산천이 구분되지 않는다.','"00" KTX · "07" 산천A · "0A" 산천B · "10" 산천C · "08" ITX-새마을'],
      ['h_trn_clsf_nm','','열차 종류 이름.','"KTX"'],
      ['h_trn_gp_cd','','열차 그룹 코드. KTX와 KTX-산천이 똑같이 100이라 편성 판별에는 못 쓴다.','"100"'],
      ['h_dpt_dt / h_dpt_tm','','출발일 / 출발시각.','"20260930" / "074100"'],
      ['h_arv_dt / h_arv_tm','','도착일 / 도착시각.','"20260930" / "094600"'],
      ['h_run_dt','','운행일. 자정을 넘기는 열차는 출발일과 다를 수 있어 예약 요청에 따로 실린다.','"20260930"'],
      ['h_dpt_rs_stn_cd / h_arv_rs_stn_cd','','출발/도착역 코드. 예약·좌석 API는 이름이 아니라 이 코드를 쓴다.','"0036" 광주송정 / "0104" 용산'],
      ['h_dpt_rs_stn_nm / h_arv_rs_stn_nm','','출발/도착역 이름. 앱은 이 값으로 "요청한 구간이 맞는지" 한 번 더 거른다.','"광주송정" / "용산"'],
      ['h_dpt_stn_run_ordr / h_arv_stn_run_ordr','','<b>정차 순번</b>(이 열차의 몇 번째 정차역인지). 호차·좌석맵 API의 필수 입력인데 korail2가 버려서, 앱이 조회 응답을 직접 가로채 보관한다.','"3" / "11"'],
      ['h_gen_rsv_cd','','<b>일반실 상태.</b> 객실등급을 정하는 근거.','"11" 예약가능 · "13" 매진 · "00" 미편성'],
      ['h_spe_rsv_cd','','<b>특실 상태.</b> 값 의미는 위와 같다.','"11" / "13" / "00"'],
      ['h_wait_rsv_flg','','예약대기 가능 여부.','"-2" 좌석 있음 · "9" 예약대기 가능 · "0" 대기도 없음'],
      ['h_rsv_psb_flg / h_rsv_psb_nm','','예약 가능 여부와 안내 문구.','"Y" / "좌석많음"'],
      ['h_gen_rsv_nm / h_spe_rsv_nm','','일반실/특실 잔여 안내 문구.','"좌석많음"'],
      ['h_spe_rsv_psb_nm','','특실 안내(가격·적립 포함). 등급별 요금을 눈으로 확인할 때 쓴다.','"60,500원 5%적립"']]},

{id:'cls', kind:'l', t:'객실등급 결정', ep:'seat_class_for(train, option)  — 앱 내부, 호출 없음',
 note:'이 값 하나가 뒤의 호차 목록·좌석맵·예약 요청 <b>세 곳</b>에 똑같이 들어가야 한다. 한 곳이라도 다르면 예약이 ERS700120으로 거절된다(2026-09-09 실사고).',
 in:[['option','필','사용자의 좌석 등급 설정.','GENERAL_FIRST 일반실 우선 · GENERAL_ONLY 일반실만 · SPECIAL_FIRST 특실 우선 · SPECIAL_ONLY 특실만'],
     ['has_general_seat()','필','일반실에 자리가 있는지. 조회 응답의 h_gen_rsv_cd == "11".','true / false'],
     ['has_special_seat()','필','특실에 자리가 있는지. h_spe_rsv_cd == "11".','true / false']],
 out:[['"1" | "2"','','일반실 / 특실. 규칙: <b>일반실만</b>→항상 1, <b>특실만</b>→항상 2, <b>일반실 우선</b>→일반실 자리 있으면 1 없으면 2, <b>특실 우선</b>→특실 자리 있으면 2 없으면 1.','KTX 406 · 특실 우선 → "2"']]},

{id:'cars', kind:'w', t:'호차 목록 + 호차별 잔여석', ep:'POST .research.TrainResearch',

const SHORT = {code:'암호화키', login:'로그인', sched:'열차조회', cls:'등급결정', cars:'호차목록',
  map:'좌석맵', pick:'좌석선택', rsv:'예약', view:'예약재조회', paykey:'간편결제키', pay:'결제'};
const RQ = {'필':['q','필수'],'선':['o','선택'],'조':['c','조건부']};
function fields(rows, cond){
  return rows.map(function(r){
    var rq = RQ[r[1]] || null;
    return '<div class="f"><div class="fh"><code>' + r[0] + '</code>' +
      (rq ? '<span class="rq ' + rq[0] + '">' + rq[1] + '</span>' : '') + '</div>' +
      '<div class="fd">' + r[2] + '</div>' +
      (r[3] ? '<div class="fx">예) <s>' + r[3] + '</s></div>' : '') + '</div>';
  }).join('');
}
function sec(cls, title, rows){
  return '<div class="sec ' + cls + '"><h3>' + title + '</h3><div>' + fields(rows) + '</div></div>';
}
function render(c){
  document.getElementById('intro').innerHTML = c.desc;
  // 케이스 매트릭스
  var mx = '<table class="mx"><tr><th>케이스</th>' +
    S.map(function(s, i){ return '<th>' + (i + 1) + '. ' + (SHORT[s.id] || s.t) + '</th>'; }).join('') + '</tr>' +
    CASES.map(function(x){
      return '<tr class="' + (x.id === c.id ? 'on' : '') + '"><td>' + x.name + '</td>' +
        S.map(function(s){ return x.use.indexOf(s.id) >= 0 ? '<td class="y">●</td>' : '<td class="n">·</td>'; }).join('') +
        '</tr>';
    }).join('') + '</table>';
  document.getElementById('mx').innerHTML = mx;

  var out = [];
  S.forEach(function(s, i){
    if (i) out.push('<div class="arrow">↓</div>');
    var used = c.use.indexOf(s.id) >= 0;
    var mark = (c.marks || {})[s.id];
    var kindTag = s.kind === 'm' ? '<span class="tag t-m">모바일 API</span>'
                : s.kind === 'w' ? '<span class="tag t-w">웹 API</span>'
                : '<span class="tag t-l">앱 내부</span>';
    var body = '';
    body += sec('in', '보내는 값', s.in);
    if (s.add)   body += sec('cond', s.addLabel || '조건부 추가', s.add);
    if (s.ncard) body += sec('cond', s.ncardLabel || '조건부 추가', s.ncard);
    body += sec('out', '돌려받는 값', s.out);
    out.push('<div class="card step' + (used ? '' : ' off') + '">' +
      '<div class="hd"><div class="no ' + (s.kind === 'w' ? 'w' : s.kind === 'l' ? 'l' : '') + '">' + (i + 1) + '</div>' +
      '<div class="ttl">' + s.t + '</div>' +
      (s.dyna ? '<span class="tag t-dyna">Dynapath</span>' : '') + kindTag + '</div>' +
      '<div class="ep">' + s.ep + '</div>' +
      (used ? '' : '<p class="note skip">이 케이스(' + c.name + ')에서는 호출하지 않는다.</p>') +
      (mark ? '<p class="note"><b>이 케이스</b> — ' + mark + '</p>' : '') +
      '<p class="note">' + s.note + '</p>' +
      (s.warn ? '<p class="note warn">⚠ ' + s.warn + '</p>' : '') +
      (s.hit ? '<p class="note hit">✖ ' + s.hit + '</p>' : '') +
      body + '</div>');
  });
  document.getElementById('flow').innerHTML = out.join('');
}
var bar = document.getElementById('cases');
CASES.forEach(function(c, i){
  var b = document.createElement('button');
  b.className = 'case' + (i ? '' : ' on'); b.textContent = c.name;
  b.onclick = function(){
    [].forEach.call(bar.children, function(x){ x.classList.remove('on'); });
    b.classList.add('on'); render(c); window.scrollTo(0, 0);
  };
  bar.appendChild(b);
});
render(CASES[0]);
</script></body></html>
